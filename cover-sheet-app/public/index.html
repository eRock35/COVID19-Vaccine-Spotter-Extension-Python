<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cover Sheet</title>
<style>
  :root {
    --bg: #0b0f14; --card: #131a22; --border: #223; --text: #e8edf2; --muted: #8a97a5;
    --accent: #dc2626; --accent2: #f59e0b; --good: #16a34a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header h1 { margin: 0 0 10px; font-size: 20px; }
  nav { display: flex; gap: 6px; overflow-x: auto; }
  nav button { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 13px; cursor: pointer; }
  nav button.active { background: var(--accent); border-color: var(--accent); }
  main { padding: 16px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  button.action { background: var(--accent); border: none; color: #fff; padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  button.action.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.action:disabled { opacity: 0.5; cursor: default; }
  input[type=text] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f151c; color: var(--text); }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent2); color: #111; font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .answer { white-space: pre-wrap; font-size: 13px; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
  section { display: none; }
  section.active { display: block; }
</style>
</head>
<body>
<header>
  <h1>🏈 Cover Sheet</h1>
  <nav>
    <button data-tab="today" class="active">Today's Card</button>
    <button data-tab="games">All Games</button>
    <button data-tab="slip">My Slip</button>
    <button data-tab="research">Research</button>
    <button data-tab="dawgs">My Dawgs</button>
  </nav>
</header>
<main>
  <section id="today" class="active">
    <div id="todayList" class="empty">Loading today's card…</div>
  </section>

  <section id="games">
    <div id="gamesList" class="empty">Loading games…</div>
  </section>

  <section id="slip">
    <div id="slipList" class="empty">Your slip is empty. Add games from Today's Card or All Games.</div>
  </section>

  <section id="research">
    <div class="card">
      <h3>Ask about any matchup</h3>
      <p class="muted">Requires login (uses Claude + live web search).</p>
      <input type="text" id="customQuestion" placeholder="e.g. Any injury news for Georgia vs Alabama?" />
      <div style="margin-top:8px;"><button class="action" id="askBtn">Ask Claude</button></div>
      <div id="askResult"></div>
    </div>
    <div id="researchList" class="empty">No research yet.</div>
  </section>

  <section id="dawgs">
    <div id="dawgsList" class="empty">Loading My Dawgs…</div>
  </section>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
const tabs = document.querySelectorAll('nav button');
const sections = document.querySelectorAll('main section');
tabs.forEach((btn) => {
  btn.addEventListener('click', () => {
    tabs.forEach((b) => b.classList.remove('active'));
    sections.forEach((s) => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'slip') renderSlip();
  });
});

function getSlip() {
  try { return JSON.parse(localStorage.getItem('coverSheetSlip') || '[]'); } catch { return []; }
}
function saveSlip(slip) { localStorage.setItem('coverSheetSlip', JSON.stringify(slip)); }
function addToSlip(game) {
  const slip = getSlip();
  if (!slip.find((g) => g.id === game.id)) {
    slip.push(game);
    saveSlip(slip);
    alert(`Added ${game.matchup || game.id} to your slip.`);
  } else {
    alert('Already in your slip.');
  }
}
function removeFromSlip(id) {
  saveSlip(getSlip().filter((g) => g.id !== id));
  renderSlip();
}
function renderSlip() {
  const slip = getSlip();
  const el = $('#slipList');
  if (!slip.length) {
    el.className = 'empty';
    el.textContent = 'Your slip is empty. Add games from Today\'s Card or All Games.';
    return;
  }
  el.className = '';
  el.innerHTML = slip.map((g) => `
    <div class="card">
      <div class="row">
        <div>
          <h3>${escapeHtml(g.matchup || g.id)}</h3>
          <div class="muted">${escapeHtml(g.pick || '')}</div>
        </div>
        <button class="action secondary" onclick="removeFromSlip('${g.id}')">Remove</button>
      </div>
    </div>`).join('');
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function gameCard(g, { showPick } = {}) {
  return `
    <div class="card">
      <div class="row">
        <div>
          <h3>${escapeHtml(g.matchup || g.id)}</h3>
          <div class="muted">${escapeHtml(g.kickoff || '')} ${g.line ? '· ' + escapeHtml(g.line) : ''}</div>
          ${showPick && g.pick ? `<div style="margin-top:6px;"><span class="badge">PICK</span> ${escapeHtml(g.pick)}</div>` : ''}
        </div>
        <button class="action" onclick='addToSlip(${JSON.stringify(g).replace(/'/g, "&#39;")})'>Add to Slip</button>
      </div>
    </div>`;
}

async function loadGames() {
  try {
    const res = await fetch('/api/games');
    const games = await res.json();

    const today = games.filter((g) => g.featured);
    $('#todayList').className = today.length ? '' : 'empty';
    $('#todayList').innerHTML = today.length
      ? today.map((g) => gameCard(g, { showPick: true })).join('')
      : 'No featured picks yet — check back soon.';

    $('#gamesList').className = games.length ? '' : 'empty';
    $('#gamesList').innerHTML = games.length
      ? games.map((g) => gameCard(g)).join('')
      : 'No games loaded yet.';
  } catch (err) {
    console.error(err);
    $('#todayList').textContent = 'Failed to load games.';
    $('#gamesList').textContent = 'Failed to load games.';
  }
}

async function loadResearch() {
  try {
    const res = await fetch('/api/asks');
    const asks = await res.json();
    $('#researchList').className = asks.length ? '' : 'empty';
    $('#researchList').innerHTML = asks.length
      ? asks.map((a) => `
        <div class="card">
          <h3>${escapeHtml(a.matchup || a.question || 'Research')}</h3>
          ${a.question ? `<div class="muted">${escapeHtml(a.question)}</div>` : ''}
          <div class="answer">${escapeHtml(a.answer || '')}</div>
        </div>`).join('')
      : 'No research yet.';
  } catch (err) {
    console.error(err);
  }
}

async function loadDawgs() {
  try {
    const res = await fetch('/api/uga');
    const items = await res.json();
    $('#dawgsList').className = items.length ? '' : 'empty';
    $('#dawgsList').innerHTML = items.length
      ? items.map((i) => `<div class="card"><h3>${escapeHtml(i.title || 'Update')}</h3><div class="answer">${escapeHtml(i.body || i.answer || '')}</div></div>`).join('')
      : 'Nothing on the Dawgs yet.';
  } catch (err) {
    console.error(err);
  }
}

$('#askBtn').addEventListener('click', async () => {
  const question = $('#customQuestion').value.trim();
  if (!question) return;
  const btn = $('#askBtn');
  btn.disabled = true;
  btn.textContent = 'Asking…';
  $('#askResult').innerHTML = '';
  try {
    const res = await fetch('/api/research/custom', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    if (res.status === 401) {
      $('#askResult').innerHTML = '<p class="muted">Login required for custom research. Reload and sign in when prompted.</p>';
      location.reload();
      return;
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    $('#askResult').innerHTML = `<div class="answer">${escapeHtml(data.answer)}</div>`;
    $('#customQuestion').value = '';
    loadResearch();
  } catch (err) {
    $('#askResult').innerHTML = `<p class="muted">Error: ${escapeHtml(err.message)}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ask Claude';
  }
});

loadGames();
loadResearch();
loadDawgs();
renderSlip();
</script>
</body>
</html>
